version: '3.8'

services:
  admin-server-db:
    image: postgres:15
    container_name: admin-server-db
    environment:
      POSTGRES_DB: adminserver
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5436:5432"

  admin-server:
    image: admin-server-image   # Ersetze durch den Namen deines gebauten Admin-Server-Images
    container_name: admin-server
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://admin-server-db:5432/adminserver
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      - admin-server-db